seed: 0

data:
  image_root: data/raw/ShapeNetRendering
  points_root: data/raw/ShapeNet_pointclouds
  feature_dir: data/processed/rgb2point_vit
  split: data/ShapeNet.json
  classes: [car, airplane, chair]
  image_size: 224
  num_points: 1024
  batch_size: 32
  num_workers: 8
  test_view: 0

model:
  name: rgb2point
  backbone: vit_base_patch16_224
  num_heads: 4
  dim_feedforward: 2048

train:
  epochs: 50            # about 3.5 min per epoch on L4 (official code: 1000)
  optimizer: adam
  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 5.0
  loss_scale: 5.0
  scheduler: plateau
  amp: bf16
  select_by: val_cd

output_dir: outputs/rgb2point
