seed: 0

data:
  image_root: data/raw/ShapeNetRendering
  voxel_root: data/raw/ShapeNetVox32
  split: data/ShapeNet.json
  classes: [car, airplane, chair]
  mean: [0.5, 0.5, 0.5]       # official normalize: x * 2 - 1
  std: [0.5, 0.5, 0.5]
  background: 0                # official command does not set --background, so the default (0, 0, 0) is used
  augment: false
  one_view_per_object: true    # official epoch: one random view of each object
  batch_size: 16
  num_workers: 8
  test_view: 0                 # official val/test mode="first"

model:
  name: retr_s
  encoder: deit_tiny_distilled_patch16_224
  encoder_dropout: 0.4
  decoder_depth: 6
  decoder_heads: 3
  decoder_dim: 192
  decoder_dropout: 0.4
  patch_num: 4
  cnn_dim: 64
  threshold: 0.5

train:
  epochs: 50
  optimizer: adamw
  lr: 1.0e-4
  encoder_lr: 1.0e-4           # official: one lr for the whole model
  weight_decay: 1.0e-2
  scheduler: constant          # official sched_factor = 1
  loss: dice
  amp: bf16
  select_by: val_iou

output_dir: outputs/retr_s
