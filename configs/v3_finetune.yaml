seed: 0

data:
  image_root: data/raw/ShapeNetRendering
  points_root: data/raw/ShapeNet_pointclouds
  feature_dir: data/processed/v3_finetune  # val/test features of the fine-tuned ViT (after training)
  split: data/ShapeNet.json
  classes: [car, airplane, chair]
  image_size: 224
  num_points: 1024
  batch_size: 32
  num_workers: 8
  test_view: 0

model:
  name: v3_finetune
  backbone: vit_base_patch14_reg4_dinov2.lvd142m  # DINOv2 with 4 registers
  tokens: pooled        # CLS + patch tokens pooled to 7 x 7 = 50 tokens
  head: query           # Transformer decoder with learnable queries
  num_queries: 256      # 256 queries x 4 points = 1024 points
  dim: 256
  num_layers: 4
  num_heads: 8
  finetune_blocks: 4    # train the last 4 of 12 ViT blocks

train:
  epochs: 8             # about 16 min per epoch on L4: every step runs the full model on augmented images
  init_head: outputs/baseline1/v2_dinov2/best.pt
  optimizer: adam
  lr: 3.0e-5            # decoder
  vit_lr: 1.0e-5        # last ViT blocks
  grad_clip: 5.0
  loss_scale: 5.0
  scheduler: cosine
  amp: bf16
  select_by: val_cd

output_dir: outputs/baseline1/v3_finetune
