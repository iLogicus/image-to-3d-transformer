# CI: tests on every push / pull request, then the Docker image is built and smoke tested.
# CD (push to main or manual run): the image goes to GitHub Container Registry, and the same image is deployed to
# Google Cloud Run (public URL). The two CD jobs are independent.
# Repo settings needed for deploy: secret GCP_SA_KEY (service account key JSON), variables GCP_PROJECT and
# GCP_REGION. Without GCP_SA_KEY the deploy steps are skipped.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-demo.txt
      - name: Tests
        run: python -m pytest tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -f docker/Dockerfile -t image-to-3d .
      - name: Smoke test (server starts, /health answers)
        run: |
          docker run -d -p 7860:7860 --name app image-to-3d
          for i in $(seq 30); do curl -sf localhost:7860/health && exit 0; sleep 2; done
          docker logs app
          exit 1

  ghcr:
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Build and push to GitHub Container Registry
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build -f docker/Dockerfile -t $IMAGE .
          docker push $IMAGE

  deploy:
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      REGION: ${{ vars.GCP_REGION }}
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT }}/image-to-3d/app:latest
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
        if: env.HAS_KEY == 'true'
      - name: Build and push to Artifact Registry
        if: env.HAS_KEY == 'true'
        run: |
          gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
          docker build -f docker/Dockerfile -t $IMAGE .
          docker push $IMAGE
      - name: Deploy to Cloud Run
        if: env.HAS_KEY == 'true'
        # 8 GB: the 4 models (~3 GB) plus the downloaded weights, kept in memory by Cloud Run.
        # 0 to 1 instance: free when nobody uses it, first request after a pause takes about a minute.
        run: |
          gcloud run deploy image-to-3d --image $IMAGE --region $REGION --port 7860 \
            --memory 8Gi --cpu 2 --min-instances 0 --max-instances 1 --timeout 300 \
            --allow-unauthenticated
