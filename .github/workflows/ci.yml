# CI: tests on every push / pull request. CD (push to main or manual run): Docker image to GitHub Container Registry,
# then the same app to a Hugging Face Space (Docker SDK).
# Repo settings needed for deploy: secret HF_TOKEN (write token), variables HF_SPACE (user/space) and
# WEIGHTS_REPO (user/model repo with the files of src/export_demo.py). Without HF_TOKEN the deploy job is skipped.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-demo.txt
      - name: Install
        run: |
          pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-demo.txt
      - name: Tests
        run: python -m pytest tests -v

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f docker/Dockerfile -t ghcr.io/${GITHUB_REPOSITORY,,}:latest .
      - name: Smoke test (server starts, /health answers)
        run: |
          docker run -d -p 7860:7860 --name app ghcr.io/${GITHUB_REPOSITORY,,}:latest
          for i in $(seq 30); do curl -sf localhost:7860/health && exit 0; sleep 2; done
          docker logs app
          exit 1
      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/${GITHUB_REPOSITORY,,}:latest

  deploy:
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
      WEIGHTS_REPO: ${{ vars.WEIGHTS_REPO }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Hugging Face Space
        if: env.HF_TOKEN != ''
        run: |
          pip install huggingface_hub==2.4.0
          bash docker/deploy_space.sh
