# One command demo: docker compose up --build, then open http://localhost:7860 (API docs: /docs).
# Weights (about 600 MB) are downloaded once from the Hugging Face Hub into the hf-cache volume.
services:
  demo:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: image-to-3d
    ports:
      - "7860:7860"
    volumes:
      - hf-cache:/home/user/.cache/huggingface

volumes:
  hf-cache:
